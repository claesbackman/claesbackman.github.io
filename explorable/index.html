<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Advisor for the Whole World?</title>
<meta name="description" content="An explorable explanation of how large language models give portfolio advice across twenty-one countries.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip" href="#stage">Skip to content</a>

<header id="topbar">
  <button id="homeBtn" class="tb-item tb-home" title="Back to the start">
    <span class="tb-mark" aria-hidden="true"></span>
    <span class="tb-title">One Advisor for the Whole World?</span>
  </button>
  <div class="tb-spacer"></div>
  <span id="deckLabel" class="tb-deck"></span>
  <button id="mapBtn" class="tb-item tb-btn" title="Map of the whole piece (m)">
    <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
      <circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/>
      <path d="M12 7.4 5.8 15.8M12 7.4l6.2 8.4"/>
    </svg>
    <span>Map</span>
  </button>
</header>

<main id="stage" tabindex="-1"></main>

<nav id="rail" aria-label="Slide navigation">
  <button id="prevBtn" class="rail-arrow" aria-label="Previous slide">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </button>
  <div id="dots" class="dots" role="tablist" aria-label="Slides in this chapter"></div>
  <button id="nextBtn" class="rail-arrow" aria-label="Next slide">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
  </button>
</nav>

<div id="mapOverlay" class="overlay" hidden>
  <div class="overlay-scrim" data-close></div>
  <div class="overlay-panel" role="dialog" aria-modal="true" aria-label="Map">
    <div class="overlay-head">
      <h2>Where you are</h2>
      <button class="overlay-close" data-close aria-label="Close map">&times;</button>
    </div>
    <div id="mapBody"></div>
    <div class="overlay-foot">
      <span id="mapProgress"></span>
      <span class="keyhint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> move &nbsp;·&nbsp; <kbd>m</kbd> this map</span>
      <button id="resetBtn" class="linkish">Start over</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/responses.js"></script>
<script src="js/data.js"></script>
<script src="js/data_text.js"></script>
<script src="js/prompts.js"></script>
<script src="js/bymodel.js"></script>
<script src="js/charts.js"></script>
<script src="js/playables.js"></script>
<script src="js/playables-rule.js"></script>
<script src="js/playables-side.js"></script>
<script src="js/engine.js"></script>

<script src="js/decks-rule.js"></script>
<script src="js/decks-side.js"></script>
<script src="js/ruler.js"></script>
<script>EX.start();</script>

</body>
</html>
